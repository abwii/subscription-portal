# Mise en production : `git tag v1.2.3 && git push origin v1.2.3`.
# Aucune reconstruction : on promeut l'image déjà testée du commit taggé.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  promote:
    name: Promote images to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Le tag doit pointer un commit de main"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the CI images (sha-xxxxxxx -> vX.Y.Z)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="sha-${GITHUB_SHA::7}"
          for app in api web; do
            docker buildx imagetools inspect "$repo-$app:$short" >/dev/null \
              || { echo "::error::Image $repo-$app:$short introuvable : la CI de ce commit est-elle terminée ?"; exit 1; }
            docker buildx imagetools create --tag "$repo-$app:$VERSION" "$repo-$app:$short"
          done

  # Environnement `production` : reviewer requis avant que ce job ne démarre.
  deploy-production:
    name: Deploy ${{ github.ref_name }} to production
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un seul déploiement à la fois par environnement, sans jamais en interrompre un en cours.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/fly-deploy
        with:
          tag: ${{ github.ref_name }}
          fly-token-api: ${{ secrets.FLY_API_TOKEN_API }}
          fly-token-web: ${{ secrets.FLY_API_TOKEN_WEB }}
          app-api: ${{ vars.FLY_APP_API }}
          app-web: ${{ vars.FLY_APP_WEB }}
          api-url: ${{ vars.API_URL }}
          web-url: ${{ vars.WEB_URL }}
