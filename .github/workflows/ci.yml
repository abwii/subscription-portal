name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée annule le run en cours d'une même PR, jamais sur main :
# un déploiement staging en cours doit aller au bout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Cache local Turborepo, persisté entre les runs par actions/cache (pas de secret requis).
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Même format que docker/metadata-action (type=sha,format=short) : sha-xxxxxxx.
  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version lue dans "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build

  docker:
    name: Image ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publication sur GHCR (main uniquement)
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  smoke:
    name: Smoke test (docker compose)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180

      - name: Check endpoints
        run: |
          curl --fail --silent --show-error localhost:3001/health
          curl --fail --silent --show-error localhost:3001/ready
          curl --fail --silent --show-error localhost:3000/health

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Déploiement automatique de l'image de ce commit (sha-xxxxxxx) sur staging.
  deploy-staging:
    name: Deploy to staging
    needs: [docker, smoke, image-tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un seul déploiement à la fois par environnement, sans jamais en interrompre un en cours.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/fly-deploy
        with:
          tag: ${{ needs.image-tag.outputs.tag }}
          fly-token-api: ${{ secrets.FLY_API_TOKEN_API }}
          fly-token-web: ${{ secrets.FLY_API_TOKEN_WEB }}
          app-api: ${{ vars.FLY_APP_API }}
          app-web: ${{ vars.FLY_APP_WEB }}
          api-url: ${{ vars.API_URL }}
          web-url: ${{ vars.WEB_URL }}
