# Le nom de l'app est passé par la CI (--app) : un même fichier sert staging et production.
# L'image est fournie par la CI (--image), pas de section [build].
primary_region = "cdg"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  # DATABASE_URL est un secret : `fly secrets set DATABASE_URL=... --app <app>`

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
